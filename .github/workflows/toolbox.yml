name: Toolbox Build CI

# This workflow is build verification only. Runtime verification remains on
# the named Toolbox rig because it owns the required ROM, system disk, and
# rig-local golden evidence.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Serialize runs for a PR so concurrent checks cannot create duplicate comments.
concurrency:
  group: toolbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  toolbox-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RETRO68_IMAGE: ghcr.io/autc04/retro68@sha256:459dd3ea9856262162615527021be7b64f198631dc59cca8cedbf197b7656019
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Deliberate twins across platform workflows; ci_paths.py owns the policy.
      - name: Classify PR paths
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames "origin/$BASE...HEAD" -- > "$RUNNER_TEMP/ci-paths.txt"
          python3 tools/ci/ci_paths.py --job toolbox-build --summary "$GITHUB_STEP_SUMMARY" \
            < "$RUNNER_TEMP/ci-paths.txt" | tee -a "$GITHUB_OUTPUT"

      # size-bank-refresh.yml mirrors this pinned image and build setup.
      # Retro68's public image contains both cross-toolchains and defaults to
      # the redistributable Multiversal Interfaces. Keep the interface choice
      # explicit so this check cannot silently begin consuming Apple headers.
      - name: Pull Retro68 toolchain
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        run: docker pull "$RETRO68_IMAGE"

      - name: Build Toolbox 68K
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        run: |
          # Deliberate twin of the toolbox-ppc job's container setup; keep in step
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env INTERFACES=multiversal \
            --env RETRO68_BUILD_DIR=/Retro68-build \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$RETRO68_IMAGE" \
            /bin/bash -ceu '
              cmake --preset retro68-68k-release -G "Unix Makefiles" \
                -DLOKA_TOOLBOX_MULTIVERSAL_INTERFACES=ON
              cmake --build --preset retro68-68k-release
              # The PaintDamage standalone is outside ALL and runs only on the
              # MAME rig; build it here so a source change that breaks it fails
              # in CI instead of on the next rig run (#1126).
              cmake --build --preset retro68-68k-release --target LokaPaintDamage68K_APPL

              # Keep the optional example outside the shipping size inventory.
              # Check only the real consumer here; Linux CI owns host fixtures.
              build_dir="build/retro68/68k/SmirkyCardCI"
              cmake --preset retro68-68k-release -G "Unix Makefiles" \
                -B "$build_dir" -DLOKA_TOOLBOX_MULTIVERSAL_INTERFACES=ON \
                -DLOKA_BUILD_SMIRKYCARD=ON
              cmake --build "$build_dir" --target LokaSmirkyCard68K_APPL
              # The smirkycard scenario vehicle builds only with SmirkyCard on;
              # build it here so a source change that breaks it fails in CI
              # instead of on the MAME rig, as the PaintDamage standalone above.
              cmake --build "$build_dir" --target LokaSmirkyCardTest68K_APPL
              python3 tests/scripts/ClassicInttypesTest.py --build-dir "$build_dir" \
                ClassicQuickjsHeadersTest
              python3 tests/scripts/ClassicQuickjsStackTest.py --build-dir "$build_dir"
            '

      - name: Build the PR comparison commit
        id: comparison
        if: ${{ (github.event_name != 'pull_request' || steps.changes.outputs.run == 'true') && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # HEAD is the CI merge candidate. Compare that tested integration to
          # its target, never to a moving branch tip or the cumulative bank.
          base=$(git merge-base "$PR_BASE_SHA" HEAD)
          echo "commit=$base" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$RUNNER_TEMP/retro68-size-base" "$base"
          # Deliberate twin of the candidate 68K setup above: same container
          # mount path, pinned image, interfaces, preset and generator.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env INTERFACES=multiversal \
            --env RETRO68_BUILD_DIR=/Retro68-build \
            --volume "$RUNNER_TEMP/retro68-size-base:/workspace" \
            --workdir /workspace \
            "$RETRO68_IMAGE" \
            /bin/bash -ceu '
              cmake --preset retro68-68k-release -G "Unix Makefiles" \
                -DLOKA_TOOLBOX_MULTIVERSAL_INTERFACES=ON
              cmake --build --preset retro68-68k-release
            '

      - name: Report and gate Toolbox 68K binary sizes
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        shell: bash
        env:
          LOKA_SIZE_NOTE: ${{ contains(github.event.pull_request.labels.*.name, 'size-note') && '1' || '0' }}
          COMPARISON_REF: ${{ steps.comparison.outputs.commit }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          args=()
          if [ "$IS_PR" = true ]; then
            test -n "$COMPARISON_REF"
            args=(--compare-build-root "$RUNNER_TEMP/retro68-size-base/build/retro68/68k/Release"
                  --compare-baseline "$RUNNER_TEMP/retro68-size-base/tools/ci/retro68_68k_size_baseline.json"
                  --comparison-ref "$COMPARISON_REF")
          fi
          python3 tools/ci/retro68_size_report.py build/retro68/68k/Release "${args[@]}"

      - name: Check Toolbox 68K size headroom
        id: headroom
        if: ${{ (github.event_name != 'pull_request' || steps.changes.outputs.run == 'true') && !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        run: |
          status=0
          python3 tools/ci/retro68_size_bank_refresh.py build/retro68/68k/Release \
            --check-headroom 1024 > "$RUNNER_TEMP/size-headroom.md" || status=$?
          cat "$RUNNER_TEMP/size-headroom.md"
          if [ "$status" = 2 ]; then
            echo 'low=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" != 0 ]; then
            echo '::warning::Unable to measure Retro68 size headroom'
          fi

      - name: Find, update, or clear the size headroom comment
        # Runs even when this job skipped its build: a PR that reverted to a
        # skippable diff must lose an earlier low-headroom warning.
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          HEADROOM_LOW: ${{ steps.headroom.outputs.low == 'true' }}
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- retro68-size-headroom -->';
            const reportPath = process.env.RUNNER_TEMP + '/size-headroom.md';
            const report = fs.existsSync(reportPath) ? fs.readFileSync(reportPath, 'utf8') : '';
            const body = marker + '\n' + report + '\nRun the [size bank refresh workflow](https://github.com/' +
              context.repo.owner + '/' + context.repo.repo +
              '/actions/workflows/size-bank-refresh.yml) on main to update the absolute record. ' +
              'This bank warning is informational; the PR gate compares to its built base.';
            const params = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker));
            const low = process.env.HEADROOM_LOW === 'true' && report !== '';
            if (!low) {
              // Headroom recovered (or was never low): an obsolete warning must not linger.
              if (existing) {
                await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
              }
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }

  toolbox-ppc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RETRO68_IMAGE: ghcr.io/autc04/retro68@sha256:459dd3ea9856262162615527021be7b64f198631dc59cca8cedbf197b7656019
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Deliberate twins across platform workflows; ci_paths.py owns the policy.
      - name: Classify PR paths
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames "origin/$BASE...HEAD" -- > "$RUNNER_TEMP/ci-paths.txt"
          python3 tools/ci/ci_paths.py --job toolbox-ppc --summary "$GITHUB_STEP_SUMMARY" \
            < "$RUNNER_TEMP/ci-paths.txt" | tee -a "$GITHUB_OUTPUT"

      # Retro68's public image contains both cross-toolchains and defaults to
      # the redistributable Multiversal Interfaces. Keep the interface choice
      # explicit so this check cannot silently begin consuming Apple headers.
      - name: Pull Retro68 toolchain
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        run: docker pull "$RETRO68_IMAGE"

      - name: Build Toolbox PPC
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        run: |
          # Deliberate twin of the 68K job's container setup; keep in step
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env INTERFACES=multiversal \
            --env RETRO68_BUILD_DIR=/Retro68-build \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$RETRO68_IMAGE" \
            /bin/bash -ceu '
              cmake --preset retro68-ppc-release -G "Unix Makefiles" \
                -DLOKA_TOOLBOX_MULTIVERSAL_INTERFACES=ON
              cmake --build --preset retro68-ppc-release

              # Keep the optional example outside the shipping size inventory.
              # Check only the real consumer here; Linux CI owns host fixtures.
              build_dir="build/retro68/ppc/SmirkyCardCI"
              cmake --preset retro68-ppc-release -G "Unix Makefiles" \
                -B "$build_dir" -DLOKA_TOOLBOX_MULTIVERSAL_INTERFACES=ON \
                -DLOKA_BUILD_SMIRKYCARD=ON
              cmake --build "$build_dir" --target LokaSmirkyCardPPC_APPL
              python3 tests/scripts/ClassicInttypesTest.py --build-dir "$build_dir" \
                ClassicQuickjsHeadersTest
              python3 tests/scripts/ClassicQuickjsStackTest.py --build-dir "$build_dir"
            '
