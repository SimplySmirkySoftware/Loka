name: Linux CI

# The platform workflows intentionally share one trigger surface so their
# status badges describe the same pull requests and main-branch commits.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Deliberate twins across platform workflows; ci_paths.py owns the policy.
      - name: Classify PR paths
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames "origin/$BASE...HEAD" -- > "$RUNNER_TEMP/ci-paths.txt"
          python3 tools/ci/ci_paths.py --job linux-headless --summary "$GITHUB_STEP_SUMMARY" \
            < "$RUNNER_TEMP/ci-paths.txt" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: tools/vscode-loka/package-lock.json
      - name: Check VS Code shell
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        working-directory: tools/vscode-loka
        run: |
          npm ci --ignore-scripts
          npm run check -- --pretty false
          npm run build
          LOKA_REQUIRE_NODE=1 LOKA_REQUIRE_VSCODE_ARTIFACT=1 bash ../../tests/scripts/VscodeLokaArtifactTest.sh
      - name: Smoke VS Code preview
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 xvfb xauth libxkbfile1 libsecret-1-0
          python3 -m unittest discover -s tools/vscode-loka/test/smoke -p '*_test.py'
          LOKA_REQUIRE_SMOKE_PROCESS_TESTS=1 node --test tools/vscode-loka/test/smoke/*.test.mjs
          pin=tools/vscode-loka/test/smoke/vscode-pin.json
          version=$(node -p "require('./$pin').version")
          sha256=$(node -p "require('./$pin').sha256")
          archive="$RUNNER_TEMP/loka-vscode.tar.gz"
          curl -fL --retry 3 --max-time 600 "https://update.code.visualstudio.com/$version/linux-x64/stable" -o "$archive"
          echo "$sha256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/loka-vscode"
          tar -xzf "$archive" -C "$RUNNER_TEMP/loka-vscode"
          # The runner image restricts unprivileged user namespaces, so Chromium's
          # namespace sandbox cannot start. Give the archive's own setuid sandbox
          # helper the ownership and mode Chromium requires; the sandbox stays
          # enabled and no --no-sandbox flag is used.
          sudo chown root:root "$RUNNER_TEMP/loka-vscode/VSCode-linux-x64/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/loka-vscode/VSCode-linux-x64/chrome-sandbox"
          LOKA_VSCODE="$RUNNER_TEMP/loka-vscode/VSCode-linux-x64/code" LOKA_REQUIRE_VSCODE_SMOKE=1 \
            LOKA_SMOKE_VERBOSE=1 bash tests/scripts/VscodeLokaSmokeTest.sh
      # No build can catch a reintroduced side-effect assert: it compiles, and
      # under NDEBUG it just makes a test check less than it claims (#264).
      - run: python3 tests/scripts/TestAssertCheckerTest.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tools/ci/check_test_asserts.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tools/ci/check_style_vocab.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tools/ci/check_card_shadow_tables.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tools/ci/check_native_includes.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tests/scripts/ClassicInttypesTest.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tests/scripts/NativeGeometryCheckerTest.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tools/ci/check_native_geometry.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tests/scripts/ToolboxPatternAlignmentCheckerTest.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: python3 tools/ci/check_toolbox_pattern_alignment.py
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: cmake --preset testing -DLOKA_BUILD_SMIRKYCARD=ON
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: cmake --build --preset testing
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: ctest --preset testing --output-on-failure
        env:
          LOKA_REQUIRE_NODE: '1'
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}

  linux-asan:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Deliberate twins across platform workflows; ci_paths.py owns the policy.
      - name: Classify PR paths
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames "origin/$BASE...HEAD" -- > "$RUNNER_TEMP/ci-paths.txt"
          python3 tools/ci/ci_paths.py --job linux-asan --summary "$GITHUB_STEP_SUMMARY" \
            < "$RUNNER_TEMP/ci-paths.txt" | tee -a "$GITHUB_OUTPUT"
      - run: cmake --preset testing-asan -DLOKA_BUILD_SMIRKYCARD=ON
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: cmake --build --preset testing-asan
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: ctest --preset testing-asan --output-on-failure
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}

  linux-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # Deliberate twins across platform workflows; ci_paths.py owns the policy.
      - name: Classify PR paths
        id: changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git diff --name-only --no-renames "origin/$BASE...HEAD" -- > "$RUNNER_TEMP/ci-paths.txt"
          python3 tools/ci/ci_paths.py --job linux-release --summary "$GITHUB_STEP_SUMMARY" \
            < "$RUNNER_TEMP/ci-paths.txt" | tee -a "$GITHUB_OUTPUT"
      - run: cmake --preset testing-release -DLOKA_BUILD_SMIRKYCARD=ON
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: cmake --build --preset testing-release
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
      - run: ctest --preset testing-release --output-on-failure
        if: ${{ github.event_name != 'pull_request' || steps.changes.outputs.run == 'true' }}
